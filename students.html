<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Découvrez les apprenants de la promotion ENI-Promo.">
    <title>Les apprenants | ENI-Promo</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>

<body class="students-page">


    <header class="site-header">
        <a href="index.html" class="site-header__brand">
            <img src="assets/images/logo-eni.png" alt="" class="site-header__logo">
            <span>ENI-Promo</span>
        </a>

        <nav class="site-nav" aria-label="Navigation principale">
            <ul class="site-nav__list">
                <li>
                    <a href="students.html" aria-current="page">
                        Apprenants
                    </a>
                </li>
                <li>
                    <a href="preferences.html">Préférences</a>
                </li>
                <li>
                    <a href="map.html">Carte</a>
                </li>
                <li>
                    <a href="information.html">Informations</a>
                </li>
            </ul>
        </nav>
    </header>


    <main>
        <nav class="breadcrumb" aria-label="Fil d'Ariane">
            <ol class="breadcrumb__list">
                <li class="breadcrumb__item">
                    <a href="index.html">Accueil</a>
                </li>
                <li class="breadcrumb__item" aria-current="page">
                    Apprenants
                </li>
            </ol>
        </nav>
        <h1>Les apprenants</h1>
        <p>Découvrez les membres de notre promotion.</p>
        <section class="students-controls" aria-label="Recherche et filtres des apprenants">
            <div class="students-controls__search">
                <label for="student-search">Rechercher un apprenant</label>
                <input type="search" id="student-search" name="student-search" placeholder="Nom ou prénom"
                    autocomplete="off">
            </div>
            <div class="students-controls__city">
                <label for="student-city">Filtrer par ville</label>

                <select id="student-city" name="student-city">
                    <option value="">Toutes les villes</option>
                </select>
            </div>
            <div class="students-controls__sort">
                <label for="student-sort">Trier par nom</label>

                <select id="student-sort" name="student-sort">
                    <option value="asc">De A à Z</option>
                    <option value="desc">De Z à A</option>
                </select>
            </div>
            <fieldset class="students-controls__view">
                <legend>Mode d'affichage</legend>
                <div class="students-controls__view-options">
                    <label>
                        <input type="radio" name="student-view" value="list" checked>
                        Liste
                    </label>

                    <label>
                        <input type="radio" name="student-view" value="grid">
                        Cartes
                    </label>
                </div>
            </fieldset>
        </section>

        <section class="students-results" aria-label="Résultats de la recherche des apprenants">
            <div id="students-container" class="students-results__container students-results__container--list">
                <article class="student-card">
                    <div class="student-card__content">
                        <h2 class="student-card__name">Camille Martin</h2>
                        <p class="student-card__city">Nantes</p>
                    </div>

                    <button type="button" class="student-card__button">
                        Voir le profil
                    </button>
                </article>
            </div>
        </section>
    </main>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/students.js" defer></script>
</body>

</html>
