<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personnalisez vos préférences d'affichage sur ENI-Promo.">
    <title>Préférences | ENI-Promo</title>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>

<body class="preferences-page">
    <header class="site-header">
        <a href="index.html" class="site-header__brand">
            <img src="assets/images/logo-eni.png" alt="" class="site-header__logo">
            <span>ENI-Promo</span>
        </a>

        <button class="site-nav__toggle" type="button" aria-label="Ouvrir le menu de navigation" aria-expanded="false"
            aria-controls="main-navigation">
            <span aria-hidden="true">☰</span>
        </button>

        <nav id="main-navigation" class="site-nav" aria-label="Navigation principale">
            <ul class="site-nav__list">
                <li><a href="students.html">Apprenants</a></li>
                <li><a href="preferences.html" aria-current="page">Préférences</a></li>
                <li><a href="map.html">Carte</a></li>
                <li><a href="information.html">Informations</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <nav class="breadcrumb" aria-label="Fil d'Ariane">
            <ol class="breadcrumb__list">
                <li class="breadcrumb__item">
                    <a href="index.html">Accueil</a>
                </li>
                <li class="breadcrumb__item">
                    <a href="students.html">Apprenants</a>
                </li>
                <li class="breadcrumb__item" aria-current="page">
                    Préférences
                </li>
            </ol>
        </nav>

        <h1>Préférences</h1>
        <p>Personnalisez l'apparence et l'affichage de votre annuaire.</p>


        <form id="preferences-form">
            <fieldset class="preferences-section">
                <legend>Apparence</legend>

                <div class="preferences-options">
                    <label class="preferences-option">
                        <input type="radio" name="theme" value="light" checked>
                        <span class="preferences-option__content">
                            <img src="assets/images/icons/sun.svg" alt="" class="preferences-option__icon" width="32"
                                height="32">
                            <span>Clair</span>
                        </span>
                    </label>

                    <label class="preferences-option">
                        <input type="radio" name="theme" value="dark">
                        <span class="preferences-option__content">
                            <img src="assets/images/icons/moon.svg" alt="" class="preferences-option__icon" width="32"
                                height="32">
                            <span>Sombre</span>
                        </span>
                    </label>
                </div>
            </fieldset>

            <fieldset class="preferences-section">
                <legend>Affichage des apprenants</legend>

                <div class="preferences-options">
                    <label class="preferences-option">
                        <input type="radio" name="view" value="list" checked>
                        <span class="preferences-option__content">
                            <img src="assets/images/icons/clipboard-list.svg" alt="" class="preferences-option__icon"
                                width="32" height="32">
                            <span>Liste</span>
                        </span>
                    </label>

                    <label class="preferences-option">
                        <input type="radio" name="view" value="grid">
                        <span class="preferences-option__content">
                            <img src="assets/images/icons/contact.svg" alt="" class="preferences-option__icon"
                                width="32" height="32">
                            <span>Cartes</span>
                        </span>
                    </label>
                </div>
            </fieldset>

            <div class="preferences-actions">
                <button type="submit">Enregistrer les préférences</button>
            </div>

            <p id="preferences-feedback" role="status" aria-live="polite"></p>
        </form>

    </main>


    <footer class="site-footer">
        <p class="site-footer__text">
            &copy; 2026 ENI-Promo — Projet pédagogique DWWM.
        </p>
    </footer>

    <script src="assets/js/preferences.js" defer></script>
    <script src="assets/js/navigation.js" defer></script>
</body>

</html>
